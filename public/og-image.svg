<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2d4f"/>
      <stop offset="100%" stop-color="#0F1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A9FD9"/>
      <stop offset="100%" stop-color="#7EC8E3"/>
    </linearGradient>
    <radialGradient id="blob1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#4A9FD9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4A9FD9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#7EC8E3" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7EC8E3" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Blobs -->
  <ellipse cx="200" cy="200" rx="400" ry="300" fill="url(#blob1)"/>
  <ellipse cx="1000" cy="450" rx="350" ry="280" fill="url(#blob2)"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left accent bar -->
  <rect x="80" y="160" width="8" height="310" rx="4" fill="url(#accent)" filter="url(#glow)"/>

  <!-- "DE" big logo -->
  <text x="110" y="420" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="280" fill="white" fill-opacity="0.06" letter-spacing="-10">DE</text>

  <!-- Name -->
  <text x="110" y="290" font-family="Arial, sans-serif" font-weight="800" font-size="72" fill="white" letter-spacing="-2">Diego Estela Lopez</text>

  <!-- Title -->
  <text x="110" y="360" font-family="Arial, sans-serif" font-weight="400" font-size="32" fill="url(#accent)" letter-spacing="2">SOFTWARE ENGINEER  ·  FRONTEND  ·  AI</text>

  <!-- URL -->
  <text x="110" y="530" font-family="Arial, sans-serif" font-weight="400" font-size="24" fill="white" fill-opacity="0.35" letter-spacing="1">diego-estela-lopez.vercel.app</text>

  <!-- Accent dot decoration -->
  <circle cx="1100" cy="130" r="6" fill="#4A9FD9" fill-opacity="0.6"/>
  <circle cx="1130" cy="160" r="3" fill="#7EC8E3" fill-opacity="0.4"/>
  <circle cx="1080" cy="165" r="4" fill="#4A9FD9" fill-opacity="0.3"/>
</svg>
