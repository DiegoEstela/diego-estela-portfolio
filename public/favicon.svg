<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2d4f"/>
      <stop offset="100%" stop-color="#0F1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A9FD9"/>
      <stop offset="100%" stop-color="#7EC8E3"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="100%" stop-color="#4A9FD9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="3" y="6" width="3" height="20" rx="1.5" fill="url(#bar)"/>

  <!-- "D" letter -->
  <text
    x="10" y="23"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="17"
    fill="white"
    letter-spacing="-1"
  >D</text>

  <!-- "E" letter in accent -->
  <text
    x="21" y="23"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="17"
    fill="url(#accent)"
    letter-spacing="-1"
  >E</text>
</svg>
