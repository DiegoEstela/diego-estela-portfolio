name: Feature
description: Propón una mejora o funcionalidad
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes: { label: Problema o necesidad }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Propuesta y criterios de aceptación }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [web, content, chatbot, infra]
    validations: { required: true }
